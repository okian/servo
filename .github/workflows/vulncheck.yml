name: Vulnerabilities

# govulncheck over every module in the repository: the root and each
# example. It reports a vulnerability only when the module's code can reach
# the affected function, using the Go vulnerability database. An advisory
# can be published on any day, so it runs nightly, and on any change to a
# module's requirements, the one kind of change that can bring a vulnerable
# version in.
on:
  push:
    branches: [ master ]
    paths:
      - '**/go.mod'
      - '**/go.sum'
      - '.github/workflows/vulncheck.yml'
  pull_request:
    branches: [ master ]
    paths:
      - '**/go.mod'
      - '**/go.sum'
      - '.github/workflows/vulncheck.yml'
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * *'

permissions:
  contents: read

# As in go.yml: a newer push to a pull request supersedes the older run;
# every other run is a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  # As in go.yml: the toolchain setup-go installed, never one a go directive
  # makes the go command download.
  GOTOOLCHAIN: local

jobs:
  govulncheck:
    name: govulncheck (every module)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The standard library is checked as the running toolchain's, so this
      # is the newest patch release — the one a user installing Go today
      # gets — not whichever the runner image happened to cache.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true
          cache: false

      # Built from source through the module proxy, so the checksum database
      # vouches for the version named.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      # Every module is checked before the job fails, so one finding does not
      # hide another.
      - name: govulncheck
        run: |
          fail=0
          for dir in . examples/basic examples/diagnostics examples/http examples/mocking examples/scoped examples/variants examples/tutorial; do
            echo "--- $dir ---"
            (cd "$dir" && govulncheck ./...) || fail=1
          done
          exit $fail
