name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
  schedule:
    # The scope soak below is too slow for every push and too valuable to
    # drop. 03:17 rather than on the hour, so it is not queued behind
    # everyone else's midnight cron.
    - cron: '17 3 * * *'

jobs:
  build:
    name: Build, vet, and test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest

    strategy:
      # Report every version's result: a break on one toolchain shouldn't
      # hide the state of the others.
      fail-fast: false
      matrix:
        # 1.27 is the floor declared by go.mod, and so also the oldest
        # toolchain any consumer can be on. servo type-checks *their* code
        # through go/packages, so its behaviour tracks whatever toolchain
        # they run: this list is one entry today only because the floor is
        # the current release. Add each new release here as it ships —
        # newer versions need coverage as much as the floor does.
        go-version: [ '1.27' ]

    env:
      # Pin each entry to the toolchain it installed. Under the default
      # GOTOOLCHAIN=auto, any module whose go directive outranks the matrix
      # entry silently downloads a newer toolchain, and the entry quietly
      # stops testing the version it names.
      GOTOOLCHAIN: local

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -covermode=atomic -coverprofile=cover.out ./...

      # Pinned to the floor entry so that adding a newer toolchain to the
      # matrix does not start uploading two views of the same suite, which
      # would be duplication rather than more information. Requires a
      # CODECOV_TOKEN repository secret — until that exists the action warns
      # and moves on rather than failing the job.
      - name: Upload coverage to Codecov
        if: matrix.go-version == '1.27'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: okian/servo
          files: cover.out

      # examples/basic, examples/scoped and examples/mocking are separate
      # modules (each replaces github.com/okian/servo/v3 with this
      # checkout) so they're built and tested independently.
      - name: Build and test examples/basic
        working-directory: examples/basic
        run: |
          go build ./...
          go test -race ./...

      # examples/scoped is the gate on scopes, not a demo of them. A golden
      # file cannot catch an instance torn down while a caller still holds
      # it, an acquirer spinning against a dying entry, or a goroutine per
      # key that outlives its key — so this suite runs the whole scope
      # state machine under -race, with a goroutine-leak check after every
      # test. -count=5 is a cheap multiplier on an already-fast suite: a
      # single green run of a concurrency test proves less than five do.
      # The real gate is 200 consecutive runs, in the nightly `soak` job
      # below — five is what fits in a pull request.
      - name: Build and test examples/scoped
        working-directory: examples/scoped
        run: |
          go build ./...
          go test -race -count=5 ./...

      - name: Build and test examples/mocking
        working-directory: examples/mocking
        run: |
          go build ./...
          go test -race ./...

      # examples/diagnostics is deliberately unresolvable, so it has no
      # generated file and nothing to run `servo check` against — only that
      # it's otherwise ordinary, valid Go. The eight diagnostics it's meant
      # to produce are pinned by TestExampleDiagnostic* in cmd/servo,
      # covered by the root Test step above.
      - name: Build examples/diagnostics
        working-directory: examples/diagnostics
        run: go build ./...

      # The reference check every consumer of servo should run in their own
      # CI: verify every injector's committed servo_gen.go still matches
      # what `servo generate` would produce, so drift between a constructor
      # signature change and a re-run of `servo generate` fails the build
      # instead of shipping a stale generated file.
      - name: servo check (examples/basic)
        run: go run ./cmd/servo check --dir examples/basic

      - name: servo check (examples/scoped)
        run: go run ./cmd/servo check --dir examples/scoped

      - name: servo check (examples/mocking)
        run: go run ./cmd/servo check --dir examples/mocking

      # examples/variants holds two generated variants of one injector, so
      # everything is done once per build configuration — which is exactly
      # what a project using build variants has to do in its own CI.
      - name: Build and test examples/variants
        working-directory: examples/variants
        run: |
          go build ./...
          go test -race ./...
          go build -tags=prod ./...
          go test -race -tags=prod ./...

      - name: servo check (examples/variants)
        run: |
          go run ./cmd/servo check --dir examples/variants
          go run ./cmd/servo check --dir examples/variants --tags=prod

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      # Downloaded and verified here rather than through upstream's
      # install.sh, which is currently broken for this release: the
      # checksums file lists both `<tarball>` and `<tarball>.sbom.json`,
      # and install.sh's unanchored match picks the SBOM's hash as the
      # expected value for the tarball, so it always reports a mismatch.
      # The `$` below anchors on end-of-line, which is the whole fix.
      - name: Install golangci-lint
        env:
          GOLANGCI_VERSION: 2.13.2
        run: |
          set -euo pipefail
          tarball="golangci-lint-${GOLANGCI_VERSION}-linux-amd64.tar.gz"
          base="https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_VERSION}"
          curl -sSfL -O "${base}/${tarball}"
          curl -sSfL -O "${base}/golangci-lint-${GOLANGCI_VERSION}-checksums.txt"

          # Fail loudly if the anchored match finds nothing: piping an empty
          # line list straight into sha256sum would verify nothing at all.
          line=$(grep " ${tarball}$" "golangci-lint-${GOLANGCI_VERSION}-checksums.txt")
          [ -n "$line" ] || { echo "::error::no checksum entry for ${tarball}"; exit 1; }
          printf '%s\n' "$line" | sha256sum -c -

          mkdir -p "$HOME/.local/bin"
          tar xzf "${tarball}" --strip-components=1 -C "$HOME/.local/bin" \
            "golangci-lint-${GOLANGCI_VERSION}-linux-amd64/golangci-lint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/golangci-lint" version

      # Every module, not just the root one: the example modules are what a
      # reader copies from, and two unchecked-error failures sat in
      # examples/basic precisely because nothing here looked at them.
      #
      # Every module is linted before the job fails, so one broken module
      # does not hide another.
      - name: Lint every module
        run: |
          fail=0
          for dir in . examples/basic examples/mocking examples/scoped examples/diagnostics examples/variants examples/tutorial; do
            echo "--- $dir ---"
            (cd "$dir" && golangci-lint run --timeout=5m ./...) || fail=1
          done
          # examples/variants again under the tag that selects its other
          # spec: files behind a build constraint are invisible to the
          # default run, and app_prod_test.go carried an unchecked error
          # for exactly that reason.
          echo "--- examples/variants (--tags=prod) ---"
          (cd examples/variants && golangci-lint run --timeout=5m --build-tags=prod ./...) || fail=1
          exit $fail

  # The site is five hand-written Jekyll layouts, a Liquid-templated search
  # index and a hand-formatted stylesheet, published straight to Pages from
  # docs/. Nothing else here builds it, so a broken layout or a Liquid typo
  # used to reach the published site with no pull-request check in front of
  # it. This job only builds — Pages still does the publishing.
  docs:
    name: Docs site builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      # github-pages pins the exact gem set Pages itself runs, so a build
      # that passes here is the build that happens on publish.
      - name: Install Jekyll
        run: gem install bundler github-pages

      - name: Build
        run: |
          cd docs
          github-pages build --source . --destination ../_site

      # A page whose front matter or layout is wrong still "builds" — it
      # just comes out empty or unwrapped. Assert the pages that must exist
      # do, and that the search index is valid JSON, which a Liquid error
      # inside it would silently break.
      - name: Check the output
        run: |
          set -euo pipefail
          for page in index.html preface.html comparison.html limitations.html \
                      reference/index.html reference/cli.html \
                      tutorial/01-architecture-overview.html \
                      tutorial/21-alternatives-and-further-reading.html; do
            test -s "_site/$page" || { echo "::error::_site/$page missing or empty"; exit 1; }
          done
          python3 -c "import json,sys; json.load(open('_site/search.json'))"

  # 200 consecutive green runs is the gate on scopes. It takes ~8 minutes
  # and belongs nowhere near a pull request, but it is not decoration: the
  # Acquire-racing-Shutdown teardown race reproduced about once in 200 runs
  # and passed -count=5 every time.
  soak:
    name: Scope soak (200 runs)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: 200 consecutive runs under -race
        working-directory: examples/scoped
        run: |
          for i in $(seq 1 200); do
            if ! go test -race -count=1 ./... > "$RUNNER_TEMP/soak.log" 2>&1; then
              echo "::error::failed on run $i"
              cat "$RUNNER_TEMP/soak.log"
              exit 1
            fi
          done
          echo "200 consecutive runs green"
