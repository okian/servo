name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build, vet, and test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest

    strategy:
      # Report every version's result: a break on one toolchain shouldn't
      # hide the state of the others.
      fail-fast: false
      matrix:
        # 1.27 is the floor declared by go.mod, and so also the oldest
        # toolchain any consumer can be on. servo type-checks *their* code
        # through go/packages, so its behaviour tracks whatever toolchain
        # they run: this list is one entry today only because the floor is
        # the current release. Add each new release here as it ships —
        # newer versions need coverage as much as the floor does.
        go-version: [ '1.27' ]

    env:
      # Pin each entry to the toolchain it installed. Under the default
      # GOTOOLCHAIN=auto, any module whose go directive outranks the matrix
      # entry silently downloads a newer toolchain, and the entry quietly
      # stops testing the version it names.
      GOTOOLCHAIN: local

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -covermode=atomic -coverprofile=cover.out ./...

      # Pinned to the floor entry so that adding a newer toolchain to the
      # matrix does not start uploading two views of the same suite, which
      # would be duplication rather than more information. Requires a
      # CODECOV_TOKEN repository secret — until that exists the action warns
      # and moves on rather than failing the job.
      - name: Upload coverage to Codecov
        if: matrix.go-version == '1.27'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: okian/servo
          files: cover.out

      # examples/basic, examples/scoped and examples/mocking are separate
      # modules (each replaces github.com/okian/servo/v3 with this
      # checkout) so they're built and tested independently.
      - name: Build and test examples/basic
        working-directory: examples/basic
        run: |
          go build ./...
          go test -race ./...

      # examples/scoped is the gate on scopes, not a demo of them. A golden
      # file cannot catch an instance torn down while a caller still holds
      # it, an acquirer spinning against a dying entry, or a goroutine per
      # key that outlives its key — so this suite runs the whole scope
      # state machine under -race, with a goroutine-leak check after every
      # test. -count=5 is a cheap multiplier on an already-fast suite: a
      # single green run of a concurrency test proves less than five do.
      - name: Build and test examples/scoped
        working-directory: examples/scoped
        run: |
          go build ./...
          go test -race -count=5 ./...

      - name: Build and test examples/mocking
        working-directory: examples/mocking
        run: |
          go build ./...
          go test -race ./...

      # examples/diagnostics is deliberately unresolvable, so it has no
      # generated file and nothing to run `servo check` against — only that
      # it's otherwise ordinary, valid Go. The seven diagnostics it's meant
      # to produce are pinned by TestExampleDiagnostic* in cmd/servo,
      # covered by the root Test step above.
      - name: Build examples/diagnostics
        working-directory: examples/diagnostics
        run: go build ./...

      # The reference check every consumer of servo should run in their own
      # CI: verify every injector's committed servo_gen.go still matches
      # what `servo generate` would produce, so drift between a constructor
      # signature change and a re-run of `servo generate` fails the build
      # instead of shipping a stale generated file.
      - name: servo check (examples/basic)
        run: go run ./cmd/servo check --dir examples/basic

      - name: servo check (examples/scoped)
        run: go run ./cmd/servo check --dir examples/scoped

      - name: servo check (examples/mocking)
        run: go run ./cmd/servo check --dir examples/mocking
