name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build, vet, and test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest

    strategy:
      # Report every version's result: a break on one toolchain shouldn't
      # hide the state of the others.
      fail-fast: false
      matrix:
        # 1.25 is the floor declared by go.mod; 1.26 and 1.27 are the
        # releases users are actually on. servo type-checks *their* code
        # through go/packages, so its behaviour tracks whatever toolchain
        # they run — newer versions need coverage as much as the floor does.
        go-version: [ '1.25', '1.26', '1.27' ]

    env:
      # Pin each entry to the toolchain it installed. Under the default
      # GOTOOLCHAIN=auto, any module whose go directive outranks the matrix
      # entry silently downloads a newer toolchain, and the entry quietly
      # stops testing the version it names.
      GOTOOLCHAIN: local

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -covermode=atomic -coverprofile=cover.out ./...

      # Uploaded from one matrix entry only: three uploads per run would be
      # three views of the same suite, not more information. Requires a
      # CODECOV_TOKEN repository secret — until that exists the action warns
      # and moves on rather than failing the job.
      - name: Upload coverage to Codecov
        if: matrix.go-version == '1.27'
        uses: codecov/codecov-action@v5
        with:
          files: cover.out
          token: ${{ secrets.CODECOV_TOKEN }}

      # examples/basic and examples/mocking are separate modules (each
      # replaces github.com/okian/servo/v3 with this checkout) so they're
      # built and tested independently.
      - name: Build and test examples/basic
        working-directory: examples/basic
        run: |
          go build ./...
          go test ./...

      # examples/mocking declares go 1.26, forced by its moq tool dependency
      # (github.com/matryer/moq itself declares go 1.26), so it cannot build
      # under the 1.25 entry with GOTOOLCHAIN=local. The 1.26 and 1.27
      # entries still cover it.
      - name: Build and test examples/mocking
        if: matrix.go-version != '1.25'
        working-directory: examples/mocking
        run: |
          go build ./...
          go test ./...

      # examples/diagnostics is deliberately unresolvable, so it has no
      # generated file and nothing to run `servo check` against — only that
      # it's otherwise ordinary, valid Go. The diagnostics it's meant to
      # produce are pinned by TestExampleDiagnostic* in cmd/servo, covered
      # by the root Test step above.
      - name: Build examples/diagnostics
        working-directory: examples/diagnostics
        run: go build ./...

      # The reference check every consumer of servo should run in their own
      # CI: verify every injector's committed servo_gen.go still matches
      # what `servo generate` would produce, so drift between a constructor
      # signature change and a re-run of `servo generate` fails the build
      # instead of shipping a stale generated file.
      - name: servo check (examples/basic)
        run: go run ./cmd/servo check --dir examples/basic

      # Split from the check above for the same reason the build step is
      # skipped on 1.25: loading examples/mocking needs a 1.26+ toolchain.
      - name: servo check (examples/mocking)
        if: matrix.go-version != '1.25'
        run: go run ./cmd/servo check --dir examples/mocking
