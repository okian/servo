name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build, vet, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # examples/basic and examples/mocking are separate modules (each
      # replaces github.com/okian/servo/v3 with this checkout) so they're
      # built and tested independently.
      - name: Build and test examples/basic
        working-directory: examples/basic
        run: |
          go build ./...
          go test ./...

      - name: Build and test examples/mocking
        working-directory: examples/mocking
        run: |
          go build ./...
          go test ./...

      # The reference check every consumer of servo should run in their own
      # CI: verify every injector's committed servo_gen.go still matches
      # what `servo generate` would produce, so drift between a constructor
      # signature change and a re-run of `servo generate` fails the build
      # instead of shipping a stale generated file.
      - name: servo check (examples/basic, examples/mocking)
        run: |
          go run ./cmd/servo check --dir examples/basic
          go run ./cmd/servo check --dir examples/mocking
