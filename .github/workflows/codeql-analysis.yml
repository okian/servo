name: "CodeQL"

# CodeQL's queries over the Go code and over these workflows. The actions
# language covers what a workflow file gets wrong that review tends to
# miss: an untrusted value expanded into a script, a token wider than its
# job needs, a pull request's code run where a secret is in reach.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '26 13 * * 3'

permissions:
  contents: read

# As in go.yml: a newer push to a pull request supersedes the older run;
# every other run is a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job-level permissions replace the workflow's rather than adding to
    # them, so contents: read is restated; security-events: write is what
    # uploads the results.
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # The Go extractor reads the code as the compiler sees it, so it
          # needs a build, and autobuild runs one.
          - language: go
            build-mode: autobuild
          # Workflow files are read, not built.
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
