name: Bug report
description: Something in servo isn't working as documented.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: >
        A minimal spec file or the exact `servo generate`/`servo check` invocation that
        reproduces it, plus the output you got.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: servo version
      description: >
        Output of `servo version` (`go tool servo version` if you run it as a tool), or the
        tag or commit of `github.com/okian/servo/v3` you're on.
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go version
      description: >
        Output of `go version`. servo type-checks your code with this toolchain, so it matters
        even when the bug looks unrelated to Go.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and architecture
      description: For example macOS 15 on arm64, Ubuntu 24.04 on amd64, Windows 11 on amd64.
    validations:
      required: true
