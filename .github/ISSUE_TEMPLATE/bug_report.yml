name: Bug report
description: Something in servo isn't working as documented.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: >
        A minimal spec file or the exact `servo generate`/`servo check` invocation that
        reproduces it, plus the output you got.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: servo version
      description: Tag or commit of `github.com/okian/servo/v3` you're on.
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go version
      description: Output of `go version`.
    validations:
      required: true
