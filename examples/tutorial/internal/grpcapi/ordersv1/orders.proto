syntax = "proto3";

// Package ordersv1 is the gRPC face of the same service the REST
// transports expose. It is versioned in the package name, not in a URL
// path, because a gRPC method's full name is its wire identity: renaming
// the package is a breaking change and is meant to look like one.
package ordersv1;

option go_package = "example.com/servoorders/internal/grpcapi/ordersv1";

import "google/protobuf/timestamp.proto";

service Orders {
  // Login returns a bearer token. It is the one method that does not
  // require one, and the only reason this service needs an interceptor
  // that can distinguish per-method.
  rpc Login(LoginRequest) returns (LoginResponse);

  rpc CreateOrder(CreateOrderRequest) returns (Order);
  rpc GetOrder(GetOrderRequest) returns (Order);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);

  // Recent returns the caller's recently-viewed order ids, read from the
  // per-user session scope rather than from any store.
  rpc Recent(RecentRequest) returns (RecentResponse);
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
}

message CreateOrderRequest {
  string item = 1;
  int32 quantity = 2;
}

message GetOrderRequest {
  string id = 1;
}

message ListOrdersRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListOrdersResponse {
  repeated Order orders = 1;
}

message RecentRequest {}

message RecentResponse {
  repeated string recent = 1;
}

message Order {
  string id = 1;
  string item = 2;
  int32 quantity = 3;
  string status = 4;
  google.protobuf.Timestamp created_at = 5;
}
