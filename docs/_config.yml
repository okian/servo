# GitHub Pages config for the site served from this directory (source:
# master branch, /docs folder). Only files under docs/ are published, which
# is why the tutorial's links to repo files outside it are absolute URLs
# rather than ../../ paths — those would escape the site root.

title: servo
tagline: Build-time dependency injection for Go
description: >-
  Build-time dependency injection for Go. Resolves your object graph from
  constructor signatures and generates plain, readable wiring.

url: https://okian.github.io
# Project site, so every page lives under /servo. Set explicitly rather than
# relying on Pages to infer it, so `| relative_url` is correct both here and
# in a local `jekyll serve`.
baseurl: /servo

repo: https://github.com/okian/servo
repo_branch: master
go_module: github.com/okian/servo/v3

# No `theme:` — the site uses its own layouts in _layouts/ and stylesheet in
# assets/css/. A supported Pages theme would fight them for the body element.

# Layouts are applied by path so the 21 tutorial chapters, their README, and
# the reference pages stay plain markdown with no front matter, and keep
# rendering correctly in GitHub's own file browser. jekyll-optional-front-matter (on by default for
# Pages) is what lets front-matter-less files be processed as pages at all.
#
# Scoped to tutorial/ specifically, NOT to "" — a catch-all scope would also
# match assets/css/main.css and search.json (both need front matter to be
# processed at all) and wrap a stylesheet in a page layout.
defaults:
  - scope:
      path: tutorial
    values:
      layout: chapter
  # The reference pages are front-matter-free for the same reason, and their
  # titles/descriptions come from _data/reference.yml (read by _layouts/
  # default.html) rather than from a per-file scope here.
  - scope:
      path: reference
    values:
      layout: reference
  - scope:
      path: index.md
    values:
      layout: home
  # Standalone prose pages: the plain shell, no tutorial sidebar. Scoped one
  # file at a time for the same reason as above — a catch-all would swallow
  # assets/ and search.json.
  - scope:
      path: preface.md
    values:
      layout: page
      description: >-
        Why wiring a Go service by hand stops scaling, what dependency
        injection actually means in Go, and where servo fits.
  - scope:
      path: comparison.md
    values:
      layout: page
      description: >-
        servo next to google/wire, uber-go/fx, uber-go/dig, and hand-written
        wiring — including when one of those is the better choice.
  - scope:
      path: limitations.md
    values:
      layout: page
      description: >-
        What servo cannot do, separated into permanent consequences of
        build-time resolution, deliberate omissions, and gaps.

# examples/ and the repo's own Go modules live outside docs/ and are never
# part of the site, but exclude defensively so a future move can't drag a
# vendored tree into the build.
exclude:
  - "**/*.go"
  - "**/go.mod"
  - "**/go.sum"

kramdown:
  # Heading ids are what the on-this-page TOC links to.
  auto_ids: true
  syntax_highlighter: rouge
